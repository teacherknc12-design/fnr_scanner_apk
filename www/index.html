<!DOCTYPE html>

<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#14182b;--mu:#667090;--br:#e2e6f1;--p:#4338ca;--p2:#0891b2;--sh:0 8px 26px rgba(40,50,110,.09);color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Hind Siliguri","Segoe UI",system-ui,sans-serif;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--br)}
header b{font-size:19px;letter-spacing:.2px}header small{color:var(--mu);margin-left:auto;font-size:12px}
main{max-width:880px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
h2{font-size:16px;margin:22px 0 12px}
.hero{border-radius:24px;padding:22px;color:#fff;background:radial-gradient(circle at 85% 10%,#22d3ee55,transparent 45%),linear-gradient(135deg,#312e81,#4338ca 55%,#0e7490);display:flex;align-items:center;gap:16px;box-shadow:var(--sh)}
.hero h1{margin:0 0 4px;font-size:24px}.hero p{margin:0 0 14px;opacity:.85;font-size:13.5px}
.hero .big{background:#fff;color:#312e81;border:0;border-radius:14px;padding:11px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.hero svg.art{width:92px;height:92px;margin-left:auto;flex:none}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.t{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px;background:var(--card);border:1px solid var(--br);border-radius:18px;box-shadow:var(--sh);font-weight:600;font-size:12.5px;line-height:1.25;text-align:center}
.t:active{transform:scale(.96)}
.ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.ic .i{width:27px;height:27px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--br);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);padding:4px 14px;position:relative;font-weight:600}
nav button.on{color:var(--p)}nav .n{position:absolute;top:-2px;right:6px;background:#ef4444;color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:0 4px;text-align:center}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--br);flex-wrap:wrap}.sp{flex:1}
.b1,.b2{border-radius:12px;padding:9px 16px;font-weight:700;border:1px solid var(--br);background:var(--card);display:inline-flex;align-items:center;gap:6px}
.b1{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pg{position:relative;border:2px solid var(--br);border-radius:16px;overflow:hidden;background:var(--card);aspect-ratio:3/4;display:flex}
.pg.on{border-color:var(--p)}.pg img{width:100%;height:100%;object-fit:contain;background:#e8ebf3}
.pg>b{position:absolute;left:8px;top:8px;background:#000a;color:#fff;border-radius:8px;padding:0 8px;font-size:12px}
.pg>button[data-a=sel]{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#0007;color:transparent;display:grid;place-items:center;padding:0}
.pg.on>button[data-a=sel]{background:var(--p);color:#fff}.pg>button[data-a=sel] .i{width:15px;height:15px;stroke-width:3}
.pa{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#000b;padding:4px}
.pa button{background:none;border:0;color:#fff;padding:4px}.pa .i{width:20px;height:20px}
.pg.add{border-style:dashed;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--p);font-weight:700;background:none}
.empty{text-align:center;color:var(--mu);padding:40px 10px}.empty .i{width:54px;height:54px;color:var(--p);opacity:.6}
#L{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}#L.on{display:flex}
.stage{flex:1;display:grid;place-items:center;padding:10px;min-height:0;background:#0003}
.sw{position:relative}.sw canvas{position:absolute;left:0;top:0;touch-action:none;border-radius:4px}
.tb{display:flex;gap:6px;padding:10px;overflow-x:auto;border-top:1px solid var(--br);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.tb button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--br);background:var(--card);border-radius:12px;padding:7px 12px;font-size:11.5px;font-weight:600}
.tb button.on{border-color:var(--p);color:var(--p)}.tb hr{border:0;border-left:1px solid var(--br);margin:0 4px}
.cam{background:#000;color:#fff}.cam video{flex:1;min-height:0;width:100%;object-fit:cover}
.frame{position:absolute;inset:12% 9%;border:2px dashed #fff9;border-radius:14px;pointer-events:none}
.cc{display:flex;justify-content:space-around;align-items:center;padding:18px 10px max(22px,env(safe-area-inset-bottom))}
.shot{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:#ffffff33;padding:0}.shot:active{background:#fff}
.cc button:not(.shot){background:#ffffff22;border:0;color:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
#busy{position:fixed;inset:0;z-index:99;background:#000a;color:#fff;display:none;place-items:center;text-align:center;padding:20px}
#busy.on{display:grid}#busy div{background:var(--card);color:var(--tx);padding:22px 26px;border-radius:18px;max-width:320px}
.sp1{width:34px;height:34px;border:4px solid var(--br);border-top-color:var(--p);border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}@keyframes r{to{rotate:360deg}}
#toast{position:fixed;left:50%;bottom:96px;translate:-50% 0;background:#14182b;color:#fff;border-radius:12px;padding:10px 16px;z-index:100;display:none;font-size:14px}
textarea{width:100%;flex:1;border:0;background:var(--card);color:var(--tx);padding:16px;font:16px/1.6 inherit;resize:none}
iframe{flex:1;border:0;width:100%;background:#fff}
.seg{display:inline-flex;background:#ffffff2e;border-radius:12px;padding:3px;margin-left:10px;vertical-align:middle}.seg button{border:0;background:none;color:inherit;padding:6px 12px;border-radius:9px;font-weight:700;font-size:12.5px}.seg button.on{background:#fff;color:#312e81}
.drop{display:block;border:2px dashed var(--br);border-radius:16px;padding:22px;text-align:center;font-weight:700;color:var(--p);cursor:pointer;background:var(--card)}
.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}
.fi{display:flex;align-items:center;gap:6px;margin:8px 0;padding:8px 10px;background:var(--card);border:1px solid var(--br);border-radius:12px}.fi span{flex:1;word-break:break-all}.fi button{border:0;background:none;padding:4px 8px;font-size:16px}
.pa button{padding:4px 2px}
.tx{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:12.5px;font-weight:600}
nav button{padding:4px 9px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row>*{flex:1 1 auto}.row>span{flex:0 0 auto}
details{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:10px 12px;margin:8px 0}summary{font-weight:700;cursor:pointer}
.hint{color:var(--mu);font-size:12.5px;margin:6px 0}
#sc{background:repeating-conic-gradient(#cfd3dd 0 25%,#fff 0 50%) 0 0/16px 16px}
#L2,#L3{position:fixed;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column}#L3{z-index:60}#L2.on,#L3.on{display:flex}
.ctop{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;background:#000}.ctop button{background:none;border:0;color:#fff;padding:6px}
.chip{border:1px solid #fff6!important;border-radius:14px;padding:3px 10px!important;font-size:12px;font-weight:700}.chip.on{background:#14b8a6!important;border-color:#14b8a6!important}
.ctabs{display:flex;gap:22px;overflow-x:auto;padding:12px 18px 4px;background:#000;scrollbar-width:none}.ctabs button{flex:none;background:none;border:0;color:#fff;opacity:.75;font-size:15px;padding:6px 2px;border-bottom:3px solid transparent}.ctabs button.on{color:#2dd4bf;opacity:1;border-color:#2dd4bf}
.cc2{display:flex;align-items:center;justify-content:space-around;background:#000;padding:10px 10px max(22px,env(safe-area-inset-bottom))}.cc2>*{width:96px;display:flex;justify-content:center}
.cc2 .shot{width:72px;height:72px;border:5px solid #14b8a6;background:#fff}.imp{background:none;border:0;color:#fff;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.pill{position:absolute;left:50%;bottom:14px;translate:-50% 0;display:flex;background:#0008;border-radius:20px;padding:3px}.pill button{border:0;background:none;color:#fff;padding:7px 18px;border-radius:17px;font-size:14px}.pill button.on{background:#ffffff40}
.hintp{position:absolute;left:12px;right:12px;top:12px;text-align:center;background:#0007;color:#fff;border-radius:18px;padding:8px 12px;font-size:13.5px;pointer-events:none}
.qr{position:absolute;left:19%;right:19%;top:50%;aspect-ratio:1;translate:0 -50%;border:3px solid #fff;border-radius:6px;display:none;pointer-events:none;box-shadow:0 0 0 999px #0007}.qr i{position:absolute;left:0;right:0;height:3px;background:#2dd4bf;box-shadow:0 0 10px #2dd4bf;animation:sl 2s linear infinite alternate}@keyframes sl{from{top:6%}to{top:94%}}
.cund{position:absolute;left:14px;bottom:14px;width:42px;height:42px;border-radius:50%;border:0;background:#0007;color:#fff;display:none;place-items:center}
.bth{position:relative;display:flex;align-items:center;gap:6px;background:none;border:0;color:#fff}.bth img{width:46px;height:56px;object-fit:cover;border-radius:6px;background:#fff}.bth b{position:absolute;left:34px;top:-8px;background:#f97316;border-radius:10px;font-size:12px;min-width:20px;padding:0 5px;text-align:center}
.tb .b1{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;padding:9px 22px}
@media(min-width:0){.okc{width:44px;height:44px;border-radius:50%;background:#14b8a6;display:grid;place-items:center}.okc .i{stroke-width:3}}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}body{-webkit-user-select:none;user-select:none}input,textarea,select{-webkit-user-select:text;user-select:text}*{touch-action:manipulation}.sw canvas,#so,#oc{touch-action:none}

 let a=new Float32Array(N);for(let i=0;i<N;i++)a[i]=bg[i]?0:255;a=bbl(a,w,h,1);const m=cv(w,h),y=m.getContext('2d'),e=y.createImageData(w,h);for(let i=0;i<N;i++){e.data[i*4]=e.data[i*4+1]=e.data[i*4+2]=a[i];e.data[i*4+3]=255}y.putImageData(e,0,0);return m}
function morph(a,w,h,s){const r=Math.abs(s),f=s>0?Math.max:Math.min,t=new Float32Array(a.length),o=new Float32Array(a.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=a[y*w+x];for(let k=-r;k<=r;k++){const q=x+k;if(q>=0&&q<w)v=f(v,a[y*w+q])}t[y*w+x]=v}for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=t[y*w+x];for(let k=-r;k<=r;k++){const q=y+k;if(q>=0&&q<h)v=f(v,t[q*w+x])}o[y*w+x]=v}return o}
function stRef(){stPush();const w=S.m.width,h=S.m.height,x=S.m.getContext('2d'),I2=x.getImageData(0,0,w,h);let a=new Float32Array(w*h);for(let i=0;i<w*h;i++)a[i]=I2.data[i*4];const sf=+gv('shf')||0,fe=+gv('fth')||0;if(sf)a=morph(a,w,h,sf);if(fe)a=bbl(a,w,h,fe);for(let i=0;i<w*h;i++)I2.data[i*4]=I2.data[i*4+1]=I2.data[i*4+2]=a[i];x.putImageData(I2,0,0);stDraw()}
async function stExport(){const f=stFinal(),W0=f.width,H0=f.height,u=gv('eu'),dpi=+gv('dpi')||300,K={px:1,cm:dpi/2.54,in:dpi},cvt=(x,full)=>u=='%'?x/100*full:x*K[u];let w=+gv('ew'),h=+gv('eh');w=w?cvt(w,W0):0;h=h?cvt(h,H0):0;if(w&&!h)h=w*H0/W0;if(h&&!w)w=h*W0/H0;if(!w){w=W0;h=H0}w=Math.max(1,Math.round(w));h=Math.max(1,Math.round(h));
 const ef=gv('ef'),type='image/'+ef,ext=ef=='jpeg'?'jpg':ef;let tg=+gv('tg')||0;if(tg)tg*=gv('tu')=='mb'?1048576:1024;
 const mk=(s,q)=>new Promise(r=>{const c=cv(Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s))),x=c.getContext('2d');if(type=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.imageSmoothingQuality='high';x.drawImage(f,0,0,c.width,c.height);c.toBlob(r,type,q)});
 const q0=(+gv('eq')||90)/100;let s=1,b;for(let it=0;it<14;it++){b=await mk(s,q0);if(!tg||b.size<=tg)break;if(type!='image/png'){let lo=.05,hi=q0,bb=null;for(let i=0;i<8;i++){const m=(lo+hi)/2,t=await mk(s,m);if(t.size>tg)hi=m;else{lo=m;bb=t}}if(bb){b=bb;break}}s*=.88}
 return{blob:b,w:Math.round(w*s),h:Math.round(h*s),ext}}
async function stOut(tp){try{busy('Exporting…');const r=await stExport();busy();$('#oi').textContent=`${r.w}×${r.h} px · ${(r.blob.size/1024).toFixed(1)} KB`;if(tp){const src=await rd(r.blob);pages.push({id:++uid,sel:true,src,orig:src,cor:[[0,0],[1,0],[1,1],[0,1]],filt:'org'});badge();return toast('Added to pages')}sv(r.blob,(gv('en')||S.name+'_edited')+'.'+r.ext,r.blob.type)}catch(e){busy();toast(e.message||'Failed')}}

/* ---------- no-live-camera fallbacks, ID composer ---------- */
const shrink=(c,m)=>{const k=Math.min(1,m/Math.max(c.width,c.height));if(k==1)return c;const n=cv(Math.round(c.width*k),Math.round(c.height*k));n.getContext('2d').drawImage(c,0,0,n.width,n.height);return n};
(()=>{const n=$('#camnote');if(n&&(!navigator.mediaDevices||!window.isSecureContext)){n.style.display='block';n.textContent='Live camera is off here. It needs https or localhost, or camera permission inside the APK. Tap Camera test to see why. Meanwhile photos use your phone camera app.'}})();
function noCam(){if(isCard())return idFlow();if(mode=='code')return barFallback();toast('Live camera needs https or localhost. Opening your phone camera instead.');return pick(true)}
let sides={f:null,b:null},idSide='f';
function idFlow(){sides={f:null,b:null};idUI()}
function idUI(){const T=TABS.filter(t=>['id','bank','dlic','pass'].includes(t[0])),two=mode!='pass',
 slot=(k,l)=>{const s=sides[k];return `<div style="flex:1;min-width:150px"><div style="font-weight:700;margin-bottom:6px">${l}</div><div style="aspect-ratio:1.586;border:2px dashed var(--br);border-radius:14px;display:grid;place-items:center;background:var(--card);overflow:hidden">${s?`<img src="${s.url}" style="width:100%;height:100%;object-fit:contain">`:`<span style="color:var(--mu)">${I('id')}</span>`}</div><div class="row" style="margin-top:8px"><button class="b2" onclick="idPick('${k}',1)">${I('cam')}${s?'Retake':'Camera'}</button><button class="b2" onclick="idPick('${k}',0)">${I('img')}Gallery</button>${s?`<button class="b2" onclick="idAdj('${k}')">${I('crop')}</button>`:''}</div></div>`};
 openL(`<div class="bar"><button class="b2" onclick="closeL()">${I('left')}</button><b>${(TABS.find(t=>t[0]==mode)||[0,'ID Card'])[1]}</b></div><div style="padding:14px;overflow:auto;flex:1;max-width:640px;width:100%;margin:auto"><div class="tb" style="padding:0 0 10px">${T.map(t=>`<button class="${t[0]==mode?'on':''}" onclick="mode='${t[0]}';idUI()">${t[1]}</button>`).join('')}</div><div class="row" style="align-items:flex-start">${slot('f',mode=='pass'?'Photo page':'Front')}${two?slot('b','Back'):''}</div><p class="hint">Both sides go on ONE A4 page. The back side is optional. Put the card on a dark, plain surface for the cleanest edges.</p><button class="b1" style="width:100%;justify-content:center;padding:14px" onclick="idMake()" ${sides.f?'':'disabled'}>Make A4 page</button></div>`)}
function idPick(k,cap){idSide=k;const f=$('#fid');f.value='';cap?f.setAttribute('capture','environment'):f.removeAttribute('capture');f.click()}
$('#fid').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('Processing…');await tick();try{const im=await loadImg(await rd(f)),c=cv(im.width,im.height);c.getContext('2d').drawImage(im,0,0);const w0=shrink(c,3000),cr=detect(w0),out=warp(w0,cr,'natural',false);sides[idSide]={w:w0,c:cr,out,url:out.toDataURL('image/jpeg',.6)}}catch(err){toast('Could not read this image')}busy();idUI()};
function idAdj(k){work=sides[k].w;cor=sides[k].c.map(a=>a.slice());filt='natural';editIdx=-1;RV={ds:false,wm:''};editor(()=>{const o=warp(work,cor,'natural',false);sides[k].c=cor;sides[k].out=o;sides[k].url=o.toDataURL('image/jpeg',.6);idUI()})}
function idMake(){if(!sides.f)return;const L=[sides.f.out].concat(sides.b&&mode!='pass'?[sides.b.out]:[]);closeL();idDone(L)}
function barFallback(){openL(`<div class="bar"><button class="b2" onclick="closeL()">${I('left')}</button><b>Scan Code</b></div><div style="padding:24px;max-width:520px;margin:auto;text-align:center"><p class="hint">Live scanning needs https or localhost. Take a clear, close photo of the code, or choose one from your gallery.</p><button class="b1" style="width:100%;justify-content:center;padding:14px;margin:8px 0" onclick="pick(1)">${I('cam')} Take photo</button><button class="b2" style="width:100%;justify-content:center;padding:14px" onclick="pick()">${I('img')} Choose image</button></div>`)}

async function camTest(){const r=['Secure context: '+(window.isSecureContext?'yes':'NO'),'Camera API (mediaDevices): '+(navigator.mediaDevices?'yes':'NO'),'Page address: '+location.protocol+'//'+(location.host||'(local file)'),'Android WebView app: '+(/; wv\)/.test(navigator.userAgent)?'yes':'no (normal browser)')];
 if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){try{const st=await navigator.mediaDevices.getUserMedia({video:true});st.getTracks().forEach(t=>t.stop());r.push('RESULT: camera WORKS')}catch(e){r.push('RESULT: camera error '+e.name);r.push(e.name=='NotAllowedError'?'Meaning: no camera permission. In an APK, the wrapper must declare CAMERA permission and grant it to the WebView.':e.name=='NotFoundError'?'Meaning: no camera found.':'Meaning: '+(e.message||'unknown'))}}

/* ---------- background queue, finish batch, bulk edit ---------- */
const bq=[];let bbusy=0;
function enqueue(w,cr,f,ds){const t=shrink(w,220),ph={id:++uid,sel:true,src:t.toDataURL('image/jpeg',.6),orig:null,cor:cr,filt:f,wm:'',ds,pending:1};pages.push(ph);badge();bq.push([ph,w,cr,f,ds]);runQ()}
async function runQ(){if(bbusy)return;bbusy=1;while(bq.length){const[ph,w,cr,f,ds]=bq.shift();await tick();try{const o=warp(w,cr,f,ds);ph.src=o.toDataURL(f=='sig'?'image/png':'image/jpeg',.93);ph.orig=w.toDataURL('image/jpeg',.9)}catch(e){ph.src=ph.src}ph.pending=0;thumbUI();saveDoc();if($('#v-pages').classList.contains('on'))renderPages()}bbusy=0}

async function reproc(p,mut){const im=await loadImg(p.orig);work=cv(im.width,im.height);work.getContext('2d').drawImage(im,0,0);cor=p.cor.map(a=>a.slice());filt=p.filt=='enh'?'magic':p.filt;RV={ds:!!p.ds,wm:p.wm||''};if(mut)mut();const b=build();Object.assign(p,{src:b.src,orig:b.orig,cor:b.cor,filt:b.filt,wm:b.wm,ds:b.ds})}
